# Personal APK build. Does not publish, write to the repository, or access signing secrets.
# No signing.properties: Gradle uses the runner's temporary debug key for this Release APK.
name: Build Personal MetaRelease APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-personal-apk.yaml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Record source revisions
        run: |
          git rev-parse HEAD
          git submodule status --recursive

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Set up upstream custom Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: https://github.com/MetaCubeX/go/releases/download/build
          go-version: '1.26'

      - name: Apply upstream Go Android compatibility patches
        shell: bash
        run: |
          set -euo pipefail
          cd "$(go env GOROOT)"
          for p in "$GITHUB_WORKSPACE"/.github/patch/*.patch; do
            patch --batch -p1 < "$p"
          done

      - name: Update CA certificates for mihomo
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt

      - name: Assemble MetaRelease APKs
        run: ./gradlew --no-daemon app:assembleMetaRelease

      - name: Verify APK signatures and generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd app/build/outputs/apk/meta/release
          shopt -s nullglob
          apks=( *.apk )
          if (( ${#apks[@]} == 0 )); then
            echo "No APK was generated" >&2
            exit 1
          fi
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          for apk in "${apks[@]}"; do
            "$APKSIGNER" verify --verbose --print-certs "$apk"
          done
          sha256sum -- "${apks[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload APKs and checksums (not a GitHub Release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: CMFA-Personal-MetaRelease
          path: |
            app/build/outputs/apk/meta/release/*.apk
            app/build/outputs/apk/meta/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
