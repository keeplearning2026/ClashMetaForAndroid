# Personal APK build. Does not publish, write to the repository, or access signing secrets.
# No signing.properties: Gradle uses the runner's temporary debug key for this Release APK.
name: Build Personal MetaRelease APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-personal-apk.yaml
      - core/src/main/cpp/CMakeLists.txt

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Record source revisions
        run: |
          git rev-parse HEAD
          git submodule status --recursive

      - name: Read app version from Gradle
        id: app_version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' build.gradle.kts | head -n 1)"
          CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' build.gradle.kts | head -n 1)"
          test -n "$VERSION" && test -n "$CODE"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION (code $CODE)"

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Install official Go 1.26.10 (SHA-256 verified)
        shell: bash
        run: |
          set -euo pipefail
          GO_ARCHIVE="$RUNNER_TEMP/go1.26.10.linux-amd64.tar.gz"
          curl --fail --location --retry 3 --output "$GO_ARCHIVE" \
            https://go.dev/dl/go1.26.10.linux-amd64.tar.gz
          echo "ccfe7ae822d2c2f41f4fe7c956199967a4dac22d0ee0d2b2bfdb440aab3b20c5  $GO_ARCHIVE" | sha256sum --check --status
          echo "Official Go archive SHA-256 verified"
          tar -C "$RUNNER_TEMP" -xzf "$GO_ARCHIVE"
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/go/bin/go" version
          "$RUNNER_TEMP/go/bin/go" env GOROOT
          # Do not modify the downloaded Go toolchain or apply third-party runtime patches.

      - name: Update CA certificates for mihomo
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt

      - name: Assemble MetaRelease APKs
        run: ./gradlew --no-daemon app:assembleMetaRelease

      - name: Verify APK signatures and generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd app/build/outputs/apk/meta/release
          shopt -s nullglob
          apks=( *.apk )
          if (( ${#apks[@]} == 0 )); then
            echo "No APK was generated" >&2
            exit 1
          fi
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          for apk in "${apks[@]}"; do
            "$APKSIGNER" verify --verbose --print-certs "$apk"
          done
          sha256sum -- "${apks[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write version and source summary
        shell: bash
        env:
          APP_VERSION: ${{ steps.app_version.outputs.version }}
          APP_CODE: ${{ steps.app_version.outputs.code }}
        run: |
          {
            echo "## Personal CMFA MetaRelease"
            echo "- **Version:** v$APP_VERSION.Meta (versionCode $APP_CODE)"
            echo "- **Source commit:** \`$GITHUB_SHA\`"
            echo "- **Build variant:** MetaRelease (optimized, signed with temporary CI debug key)"

            echo "- **Go toolchain:** Official Go 1.26.10, SHA-256 verified (unpatched)"            echo "- **Download:** CMFA-v$APP_VERSION-MetaRelease-run$GITHUB_RUN_NUMBER"
            echo "- **Integrity:** Verify against SHA256SUMS.txt included in the artifact"
            echo "- **Note:** A new CI debug signing key may prevent in-place upgrades."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs and checksums (not a GitHub Release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: CMFA-v${{ steps.app_version.outputs.version }}-MetaRelease-run${{ github.run_number }}
          path: |
            app/build/outputs/apk/meta/release/*.apk
            app/build/outputs/apk/meta/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
